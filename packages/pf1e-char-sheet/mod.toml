[mod]
apiSchema = "0.1.0"
tag = "pf1e-sheet"
name = "Pathfinder 1e Character Sheet"
version = "1.1.0-beta.1"
author = "Ankorite"
shortDescription = "A Pathfinder 1e character sheet with Hero Lab import"

description = """
A Pathfinder 1st Edition character sheet for PlanarAlly, imported from a Hero Lab XML export
(File > Custom Output > Export XML).

- A paper-style sheet with Hero Lab's breakdowns, roll buttons and PlanarAlly dice macros
- Spells with dice formulas and casting defensively, and limited-use resources kept in step with
  token trackers
- Buffs and conditions with PF1 stacking, rule cards on hover, and the rules text in PlanarAlly's
  compendium
- A natural 20 / natural 1 animation, a Config tab, and a limited sheet for the DM's monsters and NPCs
"""
